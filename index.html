function saveScene(id){const name=$('#sn').value.trim(),module=$('#sm').value.trim(),task=$('#st').value.trim();if(!name||!module||!task)return notice('请填写名称、模块与任务');const x={name,module,task,phase:$('#sp').value,day:$('#sd').value,finished:$('#sf').checked,sop:$('#ss').value,desc:$('#sdesc').value};if(id){const s=getScene(id);Object.assign(s,x);s.rev=(s.rev||1)+1}else sceneData.push({...x,id:'scene-'+Date.now(),count:0,cases:[],rev:1});closeModal();render();notice('场景配置已保存（本地会话）')}

let roundDraft=[];function caseEditor(sid,index){sid=sid||(caseScene==='all'?sceneData[0].id:caseScene);activeScene=sid;editingCase=index??null;caseMode='manual';const s=getScene(sid),c=index!==undefined?s.cases[index]:null;roundDraft=c?[...c.rounds]:[''];caseForm(c?.name||'',c?.desc||'')}

function saveCase(){let c;if(caseMode==='import'){try{c=JSON.parse($('#importJson').value);if(typeof c.name!=='string'||!Array.isArray(c.rounds)||!c.rounds.length||c.rounds.some(r=>typeof r!=='string'||!r.trim()))throw 0}catch{return notice('JSON 需包含 name 和非空文本 rounds 数组')}}else{c={name:$('#cn').value.trim(),desc:$('#cd').value,rounds:[...roundDraft],assertion:$('#assertion')?.value||''};if(!c.name||c.rounds.some(x=>!x.trim()))return notice('请填写名称和每轮话术')}const s=getScene(activeScene);if(editingCase===null){s.cases.push(c);s.count++}else{c.rev=(s.cases[editingCase].rev||1)+1;s.cases[editingCase]=c}s.rev=(s.rev||1)+1;closeModal();render();notice('用例已保存为新快照（本地会话）')}

function runsView(){return `<div class="stats"><div class="stat"><span class="muted">执行任务</span><b>${runs.length}</b></div><div class="stat"><span class="muted">执行中</span><b>${runs.filter(r=>r.state==='执行中').length}</b></div><div class="stat"><span class="muted">断言失败用例</span><b>${runs.reduce((n,r)=>n+r.failed,0)}</b></div><div class="stat"><span class="muted">待人工评审</span><b>${runs.reduce((n,r)=>n+r.review,0)}</b></div></div><section class="panel"><div class="toolbar"><input aria-label="搜索执行记录" type="search" placeholder="搜索测试任务" value="${esc(q)}" oninput="q=this.value;$('#runRows').innerHTML=runRows()"><select aria-label="筛选执行状态" onchange="runFilter=this.value;render()">${['全部状态','执行中','执行完成','失败'].map(s=>`<option ${runFilter===s?'selected':''}>${s}</option>`).join('')}</select><button class="link" onclick="q='';runFilter='全部状态';render()">重置</button><span class="right muted">执行状态、断言与人工评审分别记录</span></div><div id="runRows">${runRows()}</div></section>`}
function runRows(){return `<table><thead><tr><th>任务名称</th><th>版本快照</th><th>用例数</th><th>执行状态</th><th>断言失败</th><th>待评审</th><th>创建时间</th><th>操作</th></tr></thead><tbody>${runs.map((r,i)=>({...r,i})).filter(r=>r.name.includes(q)&&(runFilter==='全部状态'||r.state===runFilter)).map(r=>`<tr><td><strong>${esc(r.name)}</strong><div class="row-sub">${r.demo?'本地模拟任务':'依据已读取的任务摘要'}</div></td><td><span class="tag">${esc(r.version)}</span></td><td>${r.count}</td><td><span class="tag ${r.state==='失败'?'red':r.state==='执行完成'?'green':''}">${r.state}</span>${r.state==='执行中'?`<div class="progress"><i style="width:${r.progress}%"></i></div>`:''}</td><td>${r.failed}</td><td>${r.review}</td><td class="muted">${r.date}</td><td><button class="link" onclick="showResult(${r.i})">详情</button><button class="link" onclick="launch('${r.scene}')">重新测试</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">无匹配记录</td></tr>'}</tbody></table>`}
function launch(id,index){launchStep=0;const s=getScene(id||'feedback');launchState={ids:[s.id],selected:{[s.id]:index!==undefined?[index]:listCases(s).map((_,i)=>i)},name:'Sleep · '+s.name,version:'当前可测版本',base:'上一可测版本',compare:false,concurrency:3};launchForm()}
function captureLaunch(){if(launchStep===0){launchState.version=$('#lv').value;launchState.compare=$('#lc').checked;launchState.base=$('#lb').value}else if(launchStep===2){launchState.name=$('#ln').value;launchState.concurrency=+$('#lcon').value}}
function nextLaunch(n){captureLaunch();if(launchStep===0&&launchState.compare&&launchState.version===launchState.base)return notice('请选择不同的对比版本');if(launchStep===1&&!selectedCount())return notice('请至少选择一个用例');launchStep=n;launchForm()}function selectedCount(){return launchState.ids.reduce((n,id)=>n+(launchState.selected[id]?.length||0),0)}
function toggleLaunchScene(id,on){if(on){if(!launchState.ids.includes(id))launchState.ids.push(id);launchState.selected[id]=listCases(getScene(id)).map((_,i)=>i)}else{launchState.ids=launchState.ids.filter(x=>x!==id);launchState.selected[id]=[]}launchForm()}function toggleLaunchCase(id,i,on){const a=launchState.selected[id]||[];launchState.selected[id]=on?[...new Set([...a,i])]:a.filter(x=>x!==i);if(launchState.selected[id].length&&!launchState.ids.includes(id))launchState.ids.push(id);launchForm()}
function launchForm(){let body='';if(launchStep===0)body=`<h2>选择测试版本</h2><p class="muted">被测对象为当前 Sleep 业务 Agent，无需另行选择 Agent。</p><div class="field"><label for="lv">测试版本</label><select id="lv"><option ${launchState.version==='当前可测版本'?'selected':''}>当前可测版本</option><option ${launchState.version==='上一可测版本'?'selected':''}>上一可测版本</option></select></div><label class="choice"><input id="lc" type="checkbox" ${launchState.compare?'checked':''} onchange="$('#baseField').hidden=!this.checked"> 版本对比</label><div id="baseField" class="field" ${launchState.compare?'':'hidden'}><label for="lb">基准版本</label><select id="lb"><option ${launchState.base==='上一可测版本'?'selected':''}>上一可测版本</option><option ${launchState.base==='当前可测版本'?'selected':''}>当前可测版本</option></select></div><div class="notice">版本选择与对比为本次设计的交互方案，当前网站未读到实际版本目录。</div>`;
if(launchStep===1)body=`<h2>选择场景与测试用例</h2><div class="toolbar"><span>已选 ${selectedCount()} 个用例</span><button class="right" onclick="sceneData.forEach(s=>{launchState.ids.push(s.id);launchState.selected[s.id]=listCases(s).map((_,i)=>i)});launchState.ids=[...new Set(launchState.ids)];launchForm()">全选</button><button onclick="launchState.ids=[];launchState.selected={};launchForm()">清空</button></div>${sceneData.map(s=>`<div class="choice"><label><input type="checkbox" aria-label="选择场景 ${esc(s.name)}" ${launchState.selected[s.id]?.length?'checked':''} onchange="toggleLaunchScene('${s.id}',this.checked)"> <strong>${esc(s.name)}</strong></label><div class="row-sub">${s.phase} / ${s.module} / ${s.task} · ${s.count} 条</div><details><summary>选择部分用例（已选 ${launchState.selected[s.id]?.length||0}）</summary>${listCases(s).map((c,i)=>`<label style="display:block;padding:7px"><input type="checkbox" aria-label="选择用例 ${esc(c.name)}" ${launchState.selected[s.id]?.includes(i)?'checked':''} onchange="toggleLaunchCase('${s.id}',${i},this.checked)"> ${esc(c.name)}</label>`).join('')}</details></div>`).join('')}`;
if(launchStep===2)body=`<h2>确认执行配置</h2><div class="panel"><h3>${selectedCount()} 个用例 · ${launchState.ids.filter(id=>launchState.selected[id]?.length).length} 个场景</h3><p>${launchState.version}${launchState.compare?' ↔ '+launchState.base:''}</p><div class="muted">跨场景选择，每个用例使用独立身份；同一用例内多轮串行。</div></div><div class="field"><label for="ln">任务名称</label><input id="ln" value="${esc(launchState.name)}"></div><div class="field"><label for="lcon">并发数（1–10）</label><input id="lcon" type="number" min="1" max="10" value="${launchState.concurrency}"></div><details><summary>初始化、发送与清理</summary><div class="notice">各场景使用自己的初始化快照。<br>企微发送使用隔离桩。<br>运行结束自动清理，并保留初始化、状态变化与原始证据。</div></details><div class="notice">本原型只模拟执行。未载入的原始话术不会被当作真实输入发送。</div>`;
modal('新建测试任务',['选择版本','选择场景与用例','确认配置'][launchStep],body,`${launchStep?`<button onclick="nextLaunch(${launchStep-1})">上一步</button>`:'<button onclick="closeModal()">取消</button>'}${launchStep<2?`<button class="primary" onclick="nextLaunch(${launchStep+1})">下一步</button>`:'<button class="primary" onclick="executeDemo()">确认并模拟执行</button>'}`)}
function executeDemo(){captureLaunch();if(!Number.isInteger(launchState.concurrency)||launchState.concurrency<1||launchState.concurrency>10)return notice('并发数需为 1–10 的整数');const ids=launchState.ids.filter(id=>launchState.selected[id]?.length);const r={name:launchState.name||'Sleep 测试任务',count:selectedCount(),failed:0,review:0,state:'执行中',progress:0,date:'刚刚',scene:ids[0],version:launchState.version+(launchState.compare?' ↔ '+launchState.base:''),demo:true,snapshot:structuredClone(launchState),sceneSnapshot:structuredClone(sceneData.filter(s=>ids.includes(s.id)))};runs.unshift(r);closeModal();section='runs';render();notice('本地模拟任务已启动');const timer=setInterval(()=>{r.progress+=25;if(r.progress>=100){clearInterval(timer);r.state='执行完成';r.review=r.count;notice('模拟完成，可查看执行记录')}if(page==='flow'&&section==='runs'&&!$('#modal').innerHTML)render()},500)}
function showResult(i){selectedRun=i;resultCase=0;resultTab='多轮对话';resultDetail()}function resultDetail(){const r=runs[selectedRun],s=r.sceneSnapshot?.find(s=>s.id===r.scene)||getScene(r.scene),cases=(r.snapshot?Object.entries(r.snapshot.selected).flatMap(([id,indexes])=>{const ss=r.sceneSnapshot.find(x=>x.id===id);return ss?indexes.map(i=>({...listCases(ss)[i],originScene:id})):[]}):listCases(s)).slice(0,Math.min(7,r.count));if(r.state==='执行中')return modal('任务执行中',r.name,`<h2>${r.progress}%</h2><div class="progress"><i style="width:${r.progress}%"></i></div><p>任务在面板关闭后继续模拟运行。</p>`,`<button onclick="resultDetail()">刷新进度</button>`);const c=cases[resultCase]||cases[0];modal('任务执行详情',r.name,`<div class="banner"><div><strong>${r.state} · ${r.count} 个用例</strong><span class="muted">断言失败 ${r.failed} · 待评审 ${r.review} · ${r.version}</span></div><button class="right" onclick="exportResult()">下载证据</button></div><div class="notice">${r.demo?'以下为本地模拟任务的演示证据。':'任务摘要依据已读取的平台内容；以下详情是布局演示，不代表该任务的完整真实证据。'}</div><div class="tabs" style="gap:14px;flex-wrap:wrap">${['多轮对话','初始化与清理','状态变化','节点链路','业务断言','原始记录','版本差异'].map(t=>`<button class="${t===resultTab?'active':''}" onclick="resultTab='${t}';resultDetail()">${t}</button>`).join('')}</div><div class="detail-grid"><aside class="case-list"><h3>任务用例</h3>${cases.map((c,j)=>`<button class="${j===resultCase?'active':''}" onclick="resultCase=${j};resultDetail()">${j+1}. ${esc(c.name)}</button>`).join('')}</aside><section><h3>${esc(c?.name||'测试用例')}</h3>${resultBody(r,c?.originScene?(r.sceneSnapshot.find(x=>x.id===c.originScene)||s):s,c)}<h3 style="margin-top:24px">人工评审</h3><p class="muted">独立于执行与业务断言，未评审不影响新测试。</p><textarea id="reviewNote" aria-label="人工评审备注" placeholder="补充问题与验收意见">${esc(r.notes?.[resultCase]||'')}</textarea><div class="toolbar" style="margin-top:12px"><span class="muted">${r.reviews?.[resultCase]||'待处理'}</span><button class="right" onclick="saveReview(false)">评审不通过</button><button class="primary" onclick="saveReview(true)">评审通过</button></div></section></div>`,`<button onclick="closeModal();render()">关闭</button><button onclick="launch('${s.id}')">新建回归测试</button>`)}
function resultBody(r,s,c){switch(resultTab){case '多轮对话':return c?.rounds.map((t,i)=>`<div class="muted">第 ${i+1} 轮 · 用户输入</div><div class="bubble user">${esc(t)}</div><div class="muted">Agent 最终回复</div><div class="bubble">${r.demo?'模拟执行已记录此轮输入；尚未连接真实模型回复。':'未在本原型载入该轮真实发送记录。'}</div>`).join('')||'';case '初始化与清理':return `<div class="choice"><h3>场景初始化</h3><p>${s.phase} / ${s.day} / ${s.finished?'已完课':'未完课'}</p><p>SOP ${s.sop} · 每个用例独立身份</p></div><details><summary>前置清理、初始化回读与结束清理</summary><pre class="console">before_cleanup → initialize → readback_assertions → after_cleanup
演示摘要：用户、训练营、课程、业务状态与缓存分别记录。</pre></details>`;case '状态变化':return `<table><thead><tr><th>状态</th><th>执行前</th><th>执行后（演示）</th></tr></thead><tbody><tr><td>先导课完课</td><td>${s.finished}</td><td>${s.finished}</td></tr><tr><td>SOP</td><td>${s.sop}</td><td>${s.sop}</td></tr><tr><td>转人工</td><td>false</td><td>未确认</td></tr></tbody></table>`;case '节点链路':return `<div class="notice">节点明细保留在执行证据中，不设置独立节点调试模块。</div>${['输入接收','业务状态读取','策略与回复处理','隔离发送'].map((n,i)=>`<details class="choice"><summary>${i+1}. ${n}</summary><p class="muted">当前展示证据布局样例。真实输入、输出、耗时与异常需从运行记录读取。</p></details>`).join('')}`;case '业务断言':return `<div class="choice"><h3>业务断言 ${r.failed?'存在失败':'摘要无失败'}</h3><p>任务摘要：断言失败 ${r.failed} 项。</p><p class="muted">断言明细、初始化验收与回复质量需结合原始报告判读。</p></div>`;case '版本差异':return r.snapshot?.compare?`<div class="two"><div class="choice"><h3>${r.snapshot.base}</h3><p>相同初始状态与输入。</p></div><div class="choice"><h3>${r.snapshot.version}</h3><p>相同初始状态与输入。</p></div></div><div class="notice">本地原型不计算模型真实差异；此处预留结论、回复、状态与节点差异。</div>`:'<div class="notice">本次记录无对比版本。新建任务时可开启版本对比。</div>';default:return `<pre class="console">${esc(JSON.stringify({prototype:true,scene:s.id,case:c?.name,execution:r.state,assertion_failures:r.failed,evidence:'layout_demo'},null,2))}</pre>`}}
function saveReview(ok){const r=runs[selectedRun],note=$('#reviewNote').value.trim();if(!ok&&!note)return notice('请填写评审不通过原因');r.reviews??={};r.notes??={};if(!r.reviews[resultCase])r.review=Math.max(0,r.review-1);r.reviews[resultCase]=ok?'评审通过':'评审不通过';r.notes[resultCase]=note;resultDetail();notice('评审已保存到本地会话')}function exportResult(){const r=runs[selectedRun],a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify({prototype:true,...r},null,2)],{type:'application/json'}));a.href=url;a.download='测试证据-原型演示.json';a.click();URL.revokeObjectURL(url)}
function startSceneChat(id){closeModal();loadChatScene(id);page='chat';render()}
function loadChatScene(id){const s=getScene(id);userState={...userState,scene:id,finished:s.finished,day:s.day,period:s.phase,sop:s.sop,handoff:false};messages=[];sessionStarted=false}
function stateRows(){const s=getScene(userState.scene);return `<div class="state-line"><span>用户身份</span><strong>模拟学员 · U-DEMO</strong></div><div class="state-line"><span>先导课完课</span><strong class="${userState.finished?'ok':''}">${userState.finished?'已完课':'未完课'}</strong></div><div class="state-line"><span>训练营周期</span><strong>${userState.day}</strong></div><div class="state-line"><span>业务阶段</span><strong>${userState.period}</strong></div><div class="state-line"><span>SOP 状态</span><strong>${userState.sop}</strong></div><div class="state-line"><span>转人工状态</span><strong>${userState.handoff?'已转人工':'未转人工'}</strong></div><div class="state-line"><span>自测链接</span><strong>${userState.linkSent?'已发送':'未发送'}</strong></div><div class="state-line"><span>模拟时间</span><strong>${userState.time.replace('T',' ')}</strong></div><h3 style="margin-top:22px">当前测试场景</h3><div class="choice"><strong>${esc(s.name)}</strong><div class="row-sub">${s.module} / ${s.task}</div></div>`}
function renderChat(){const s=getScene(userState.scene);$('#app').innerHTML=`<div class="title"><div><h1>对话模拟</h1><span class="muted">在指定学员状态和训练营周期下，验证业务 Agent 的连续应答。</span></div><button onclick="messages=[];sessionStarted=false;render();notice('已重置对话，保留用户状态')">重置会话</button></div><div class="chat-layout"><aside class="panel user-panel"><div class="toolbar"><h3 style="margin:0">用户状态</h3><button class="right link" onclick="editUserState()">编辑状态</button></div><div id="stateRows">${stateRows()}</div><div class="field"><label for="chatScene">切换测试场景</label><select id="chatScene" onchange="loadChatScene(this.value);render()">${sceneData.map(x=>`<option value="${x.id}" ${x.id===s.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><span class="muted">切换场景或修改初始状态会开启新对话。</span></aside><section class="panel chat-panel"><div class="toolbar"><h3 style="margin:0">Sleep · 业务 Agent</h3><span class="tag">${esc(chatVersion)}</span><button class="right" onclick="chatSettings()">测试配置</button><button onclick="saveChatCase()" ${messages.length?'':'disabled'}>保存为测试用例</button></div><div class="chat" id="chatHistory">${messages.length?messages.map(m=>`<div class="muted">${m.role==='user'?'模拟学员':'Sleep Agent'}${m.version?' · '+esc(m.version):''}</div><div class="bubble ${m.role==='user'?'user':''}">${esc(m.text)}</div>`).join(''):`<div class="empty"><h2>开始当前场景的对话测试</h2><p class="muted">左侧状态将作为本次对话的初始上下文。</p><button onclick="$('#chatInput').value=getScene(userState.scene).cases[0]?.rounds[0]||'老师您好'">填入场景首轮话术</button></div>`}</div><form class="toolbar" style="margin:16px 0 0" onsubmit="event.preventDefault();sendMessage()"><input style="flex:1;min-width:140px" id="chatInput" aria-label="模拟学员消息" placeholder="输入学员消息，Enter 发送"><button class="primary">发送</button></form><div class="toolbar" style="margin:12px 0 0"><button class="link" onclick="autoChat()">用户模拟 Agent 自动试聊</button><button class="link right" onclick="conversationEvidence()">查看本次状态与证据</button></div><div class="muted">本地模拟回复 · 不代表模型真实执行或企微终端送达</div></section></div>`;$('#chatHistory').scrollTop=$('#chatHistory').scrollHeight}
function editUserState(){modal('编辑用户初始状态','应用后重置对话，确保同一会话的初始条件一致。',`<div class="two"><div class="field"><label for="up">业务阶段</label><select id="up"><option ${userState.period==='接量期'?'selected':''}>接量期</option><option ${userState.period==='服务期'?'selected':''}>服务期</option></select></div><div class="field"><label for="ud">训练营周期</label><select id="ud">${['开营前','D1','D2','D3','结营后'].map(x=>`<option ${x===userState.day?'selected':''}>${x}</option>`).join('')}</select></div></div><label class="choice"><input type="checkbox" id="uf" ${userState.finished?'checked':''}> 先导课已完课</label><div class="field"><label for="us">SOP 状态</label><select id="us">${['未开始','进行中','已结束'].map(x=>`<option ${x===userState.sop?'selected':''}>${x}</option>`).join('')}</select></div><label class="choice"><input type="checkbox" id="uh" ${userState.handoff?'checked':''}> 已转人工</label><label class="choice"><input type="checkbox" id="ul" ${userState.linkSent?'checked':''}> 已发送自测链接</label><div class="field"><label for="ut">模拟时间</label><input type="datetime-local" id="ut" value="${userState.time}"></div>`,`<button onclick="closeModal()">取消</button><button class="primary" onclick="applyUserState()">应用并开启新对话</button>`)}
function applyUserState(){if(!$('#ut').value)return notice('请填写模拟时间');Object.assign(userState,{period:$('#up').value,day:$('#ud').value,finished:$('#uf').checked,sop:$('#us').value,handoff:$('#uh').checked,linkSent:$('#ul').checked,time:$('#ut').value});messages=[];sessionStarted=false;closeModal();render();notice('用户初始状态已应用')}
function chatSettings(){modal('对话测试配置','沿用当前业务 Agent 与场景状态',`<div class="field"><label for="cv">测试版本</label><select id="cv"><option ${chatVersion==='当前可测版本'?'selected':''}>当前可测版本</option><option ${chatVersion==='上一可测版本'?'selected':''}>上一可测版本</option></select></div><label class="choice"><input type="checkbox" id="cc" ${chatCompare?'checked':''}> 启用双版本对话对比</label><div class="field"><label for="cb">基准版本</label><select id="cb"><option ${baseVersion==='上一可测版本'?'selected':''}>上一可测版本</option><option ${baseVersion==='当前可测版本'?'selected':''}>当前可测版本</option></select></div><div class="notice">版本为交互占位。修改后开启新会话。</div>`,`<button onclick="closeModal()">取消</button><button class="primary" onclick="if($('#cc').checked&&$('#cv').value===$('#cb').value)return notice('请选择不同版本');chatVersion=$('#cv').value;chatCompare=$('#cc').checked;baseVersion=$('#cb').value;messages=[];closeModal();render()">应用配置</button>`)}
function demoReply(text){if(userState.handoff)return '当前为已转人工状态，此处保留人工处理状态。（模拟）';if(/退费|退款/.test(text)){userState.handoff=true;return '已记录您的退费诉求，并进入转人工处理状态。（模拟）'}if(/链接|自测/.test(text)){if(!userState.finished)return '当前先导课尚未完课，模拟承接先完成课程再领取自测的场景。';userState.linkSent=true;return '当前先导课已完课，模拟发送睡眠自测入口。'}return `已收到您在${userState.period} ${userState.day}的反馈，模拟按“${getScene(userState.scene).task}”继续处理。`}
function sendMessage(){const text=$('#chatInput').value.trim();if(!text)return;if(!messages.length)initialConversationState=structuredClone(userState);sessionStarted=true;messages.push({role:'user',text},{role:'agent',version:chatVersion,text:demoReply(text)});if(chatCompare)messages.push({role:'agent',version:baseVersion,text:'相同输入的基准版本回复占位，真实回复需接入执行服务。'});renderChat()}

function commitAssistantDraft(execute){const d=assistantDraft;if(!d)return;if(d.agent!==salesAgent||d.version!==salesVersion)return notice('草稿上下文已变化，请重新生成');const id='assistant-'+Date.now()+'-'+Math.random().toString(36).slice(2,5);sceneData.push({id,name:d.name,phase:d.phase,module:d.module,task:d.task,count:d.count,day:d.phase==='服务期'?'D2':'开营前',finished:d.phase==='服务期',sop:'进行中',desc:'测试助手创建 · '+d.agent+' / '+d.version+' · 本地规则演示',cases:d.rounds.map((text,i)=>({name:d.task+' '+(i+1),rounds:[text],assertion:d.assertion}))});suites.push({name:d.name+'测试集',ids:[id]});assistantMessages.push({role:'assistant',text:`已创建场景「${d.name}」，保存 ${d.count} 条用例，并加入同名测试集。\n可在流程测试 → 测试场景 / 用例管理查看。`});assistantDraft=null;if(execute)assistantQueueRun([id]);else render()}

function assistantQueueRun(ids){const total=ids.reduce((n,id)=>n+getScene(id).count,0),agent=salesAgent,version=salesVersion;const r={name:agent+' · 测试助手自动回归',agent,count:total,failed:0,review:0,state:'执行中',progress:0,date:'刚刚',scene:ids[0],version,demo:true,snapshot:{version,compare:false,concurrency:3,selected:Object.fromEntries(ids.map(id=>[id,listCases(getScene(id)).map((_,i)=>i)]))},sceneSnapshot:structuredClone(sceneData.filter(s=>ids.includes(s.id)))};runs.unshift(r);const conversation=assistantMessages;conversation.push({role:'assistant',text:`已提交 ${agent} / ${version} 的本地模拟执行任务。\n范围：${ids.length} 个场景、${total} 条用例；并发 3，同一用例内串行。\n可在执行记录查看。`});render();const timer=setInterval(()=>{r.progress+=25;if(r.progress>=100){clearInterval(timer);r.state='执行完成';r.review=r.count;conversation.push({role:'assistant',text:`模拟执行已完成：${agent} / ${version} · ${total} 条用例。证据已归档，等待人工评审。\n真实模型回复与业务断言需接入执行接口；本次为模拟进度。`});if(page==='assistant'&&salesAgent===agent)render();else if(salesAgent===agent)notice('测试助手任务模拟完成')}else if(page==='flow'&&section==='runs'&&salesAgent===agent&&!$('#modal').innerHTML)render()},500)}

function comparisonState(){const versions=catalog().versions;return compareStateByAgent[salesAgent]??={scope:'agent',left:versions[1]||versions[0],right:versions[0],scene:sceneData[0]?.id,module:'全部模块',leftRun:'demo',rightRun:'demo',leftSceneRev:'1',rightSceneRev:'1'}}

renderSidebar=function(){sidebarBeforeCompare();const side=$('#platformSidebar'),anchor=side.querySelector('[aria-label="对话模拟"]');if(anchor)anchor.insertAdjacentHTML('afterend',`<button class="side-item ${page==='compare'?'active':''}" title="版本对比" aria-label="版本对比" onclick="go('compare')"><span class="side-icon">⇄</span><span class="side-label">版本对比</span></button>`)};

function comparisonOptions(selected){return catalog().versions.map(v=>`<option value="${v}" ${selected===v?'selected':''}>${v}</option>`).join('')}
function comparisonRuns(version,selected){const eligible=runs.map((r,i)=>({...r,index:i})).filter(r=>r.version===version&&r.state!=='执行中');return `<option value="demo" ${selected==='demo'?'selected':''}>演示评测报告 · 固定回归集</option>${eligible.map(r=>`<option value="${r.index}" ${String(r.index)===String(selected)?'selected':''}>${esc(r.name)} · ${r.date}</option>`).join('')}`}
function renderComparison(){const c=comparisonState();if(!sceneData.some(s=>s.id===c.scene))c.scene=sceneData[0]?.id;const mods=[...new Set(sceneData.map(s=>s.module))];$('#app').innerHTML=`<div class="title"><div><h1>版本对比</h1><span class="muted">在同一 AI 销售 Agent 下，对比整体能力或同一场景模块的不同版本表现。</span></div><span class="tag">${catalog().label}</span></div><div class="panel compare-config"><div class="toolbar"><h3 style="margin:0">版本对比配置</h3><span class="right muted">基准版本在左，待验证版本在右</span></div>${c.scope==='scene'?`<div class="compare-scope-fields"><div class="field"><label for="compareScene">同一测试场景</label><select id="compareScene" onchange="setCompare('scene',this.value)">${sceneData.map(s=>`<option value="${s.id}" ${c.scene===s.id?'selected':''}>${esc(s.name)} · ${esc(s.module)}</option>`).join('')}</select></div><div class="notice">锁定同一个场景 ID，左右可选择不同 Agent 版本和场景配置快照。</div></div>`:`<div class="field" style="max-width:320px"><label for="compareModule">业务模块范围</label><select id="compareModule" onchange="setCompare('module',this.value)"><option>全部模块</option>${mods.map(m=>`<option ${m===c.module?'selected':''}>${esc(m)}</option>`).join('')}</select></div>`}<div class="compare-sides">${comparisonSide('left','基准版本 A',c)}<div class="compare-divider">⇄</div>${comparisonSide('right','对比版本 B',c)}</div><div class="compare-config-foot"><div class="muted">同一 Agent · 按用例 ID 对齐 · 配置快照差异单独标记${c.left===c.right?' · 请选择不同 Agent 版本':''}</div><button class="primary" onclick="generateComparison()" ${c.left===c.right?'disabled':''}>生成对比报告</button></div></div><div class="notice">当前可用“演示评测报告”体验完整对比。已有执行记录可选作报告来源，但未保存的逐例结果、回复和耗时显示为“缺少证据”，不会推算为通过或真实性能。</div>${compareReport&&compareReport.agent===salesAgent?comparisonReportView():`<div class="panel compare-welcome"><div class="compare-symbol">⇄</div><h2>选择左右版本，生成对比结论</h2><p class="muted">整个 Agent：汇总覆盖、通过与回归变化，并按业务模块定位问题。<br>场景模块：对齐同一场景的用例、输入、回复、断言与配置快照。</p></div>`}`}
function comparisonSide(side,label,c){return `<section class="compare-side"><div class="toolbar"><span class="compare-letter">${side==='left'?'A':'B'}</span><h3 style="margin:0">${label}</h3><span class="right muted">${salesAgent}</span></div><div class="field"><label for="${side}Version">Agent 版本</label><select id="${side}Version" onchange="setCompare('${side}',this.value)">${comparisonOptions(c[side])}</select></div>${c.scope==='scene'?`<div class="field"><label for="${side}SceneRev">场景配置版本</label><select id="${side}SceneRev" onchange="setCompare('${side}SceneRev',this.value)"><option value="1" ${c[side+'SceneRev']==='1'?'selected':''}>配置快照 1（演示）</option><option value="2" ${c[side+'SceneRev']==='2'?'selected':''}>配置快照 2（演示）</option></select></div>`:''}<div class="field"><label for="${side}Run">测试报告来源</label><select id="${side}Run" onchange="setCompare('${side}Run',this.value)">${comparisonRuns(c[side],c[side+'Run'])}</select></div><div class="compare-source-caption">${c[side+'Run']==='demo'?'演示报告：两侧使用固定用例 ID 与演示断言结果。':'已有记录：仅使用当前记录实际保存的摘要及证据。'}</div></section>`}
function comparisonRows(c){let scenes=c.scope==='scene'?[getScene(c.scene)]:sceneData.filter(s=>c.module==='全部模块'||s.module===c.module);return scenes.flatMap(s=>s.cases.filter(x=>!x.placeholder).map((item,i)=>{const id=s.id+':'+i;const left=caseEvidence(c.left,c.leftRun,s,i,item,c,'left'),right=caseEvidence(c.right,c.rightRun,s,i,item,c,'right');let change='缺少证据';if(left.result!=='unknown'&&right.result!=='unknown')change=left.result==='fail'&&right.result==='pass'?'改善':left.result==='pass'&&right.result==='fail'?'回归':left.reply!==right.reply?'回复变化':'一致';return {id,scene:s.id,sceneName:s.name,module:s.module,name:item.name,input:item.rounds.join('\n'),left,right,change,configChanged:c.scope==='scene'&&c.leftSceneRev!==c.rightSceneRev}}))}
function caseEvidence(version,source,scene,index,item,c,side){if(source!=='demo'){const r=runs[+source];const saved=r?.caseResults?.find(x=>x.caseId===scene.id+':'+index);return saved?{result:saved.passed?'pass':'fail',reply:saved.reply||'未记录回复',latency:saved.latency??null,source:'记录证据'}:{result:'unknown',reply:'缺少逐例回复与断言证据',latency:null,source:r?.name||'记录不可用'}}const position=sceneData.findIndex(s=>s.id===scene.id)*7+index;const latest=catalog().versions.indexOf(version)===0;const fail=latest?position%9===0:position%5===0;const changed=latest&&position%3===1;return {result:fail?'fail':'pass',reply:fail?'模拟：未满足当前用例的业务断言。':changed?'模拟：已按当前阶段处理诉求，并明确后续步骤。':'模拟：已按场景预期处理，业务状态符合断言。',latency:Math.round((latest?1250:1450)+(position%6)*90),source:'演示数据'}}
function generateComparison(){const c=comparisonState();if(c.left===c.right)return notice('请在同一 Agent 下选择两个不同版本');if(c.scope==='scene'&&!c.scene)return notice('请选择测试场景');for(const side of ['left','right']){if(c[side+'Run']!=='demo'){const selected=runs[+c[side+'Run']];if(!selected||selected.version!==c[side]||selected.state==='执行中')return notice('测试记录与所选版本不匹配，请重新选择报告来源')}}const rows=comparisonRows(c);if(!rows.length)return notice('当前范围没有已载入的可对比用例');compareRowFilter='全部差异';compareReport={id:'CMP-'+Date.now(),agent:salesAgent,agentLabel:catalog().label,config:structuredClone(c),created:new Date().toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'}),rows,sceneName:c.scope==='scene'?getScene(c.scene).name:null,demo:c.leftRun==='demo'||c.rightRun==='demo'};renderComparison();notice('对比报告已生成，可查看逐例差异并导出')}
function compareMetrics(r){const rows=r.rows,known=rows.filter(x=>x.left.result!=='unknown'&&x.right.result!=='unknown'),sum=side=>({pass:known.filter(x=>x[side].result==='pass').length,total:known.length,avg:known.filter(x=>x[side].latency!==null).length?Math.round(known.reduce((n,x)=>n+(x[side].latency||0),0)/known.filter(x=>x[side].latency!==null).length):null});return {known:known.length,total:rows.length,improved:known.filter(x=>x.change==='改善').length,regressed:known.filter(x=>x.change==='回归').length,changed:known.filter(x=>x.change==='回复变化').length,left:sum('left'),right:sum('right')}}
function comparisonReportView(){const r=compareReport,m=compareMetrics(r),rate=v=>v.total?(v.pass/v.total*100).toFixed(1)+'%':'—';const groups=[...new Set(r.rows.map(x=>x.module))];return `<section class="panel compare-report"><div class="title" style="margin-bottom:12px"><div><h2 style="margin-bottom:4px">${r.config.scope==='agent'?'Agent 整体版本对比报告':'场景模块版本对比报告'}</h2><span class="muted">${r.id} · ${r.created} · ${r.demo?'包含演示数据':'已有记录证据'}</span></div><div><button onclick="exportComparison('html')">导出 HTML 报告</button> <button onclick="exportComparison('json')">导出 JSON</button></div></div><div class="compare-conclusion"><strong>${r.agentLabel} · ${r.config.left} → ${r.config.right}</strong><p>${r.sceneName?'场景：'+esc(r.sceneName)+'。':''}对齐 ${m.total} 条已载入用例；${m.known} 条具备双侧结果；改善 ${m.improved} 条、回归 ${m.regressed} 条、回复变化 ${m.changed} 条。</p>${r.config.scope==='scene'&&r.config.leftSceneRev!==r.config.rightSceneRev?'<span class="tag orange">场景配置不同 · 不能将变化全部归因于 Agent 版本</span>':'<span class="tag green">场景配置一致 · 固定用例对齐</span>'}<div class="muted" style="margin-top:8px">${r.demo?'演示结果仅用于验收报告交互，不作为版本优劣的真实结论。':'未具备双侧逐例证据的用例不计入通过率或改善、回归统计。'} 仅比较已载入的代表用例，不等同完整业务覆盖。</div></div><div class="compare-metrics"><div class="stat"><span class="muted">覆盖对齐</span><b>${m.known} / ${m.total}</b><span class="muted">有双侧证据 / 已载入用例</span></div><div class="stat"><span class="muted">通过率 A → B</span><b>${rate(m.left)} <small>→</small> ${rate(m.right)}</b><span class="muted">${r.demo?'演示断言':'已保存断言'} · 同一对齐分母</span></div><div class="stat"><span class="muted">回归 / 改善</span><b><span style="color:#bf465a">${m.regressed}</span> / <span style="color:#128b75">${m.improved}</span></b><span class="muted">优先检查新增回归</span></div><div class="stat"><span class="muted">平均耗时 A → B</span><b>${m.left.avg===null?'—':m.left.avg+'ms'} <small>→</small> ${m.right.avg===null?'—':m.right.avg+'ms'}</b><span class="muted">${r.demo?'演示耗时，非真实性能':'缺失耗时不参与计算'}</span></div></div>${r.config.scope==='agent'?`<h3>按业务模块定位差异</h3><div class="compare-module-list">${groups.map((g,gi)=>{const a=r.rows.filter(x=>x.module===g);return `<button onclick="selectComparisonModule(${gi})"><strong>${esc(g)}</strong><span class="muted">${a.length} 条 · 回归 ${a.filter(x=>x.change==='回归').length} · 改善 ${a.filter(x=>x.change==='改善').length}</span></button>`}).join('')}</div>`:''}<div class="toolbar" style="margin-top:24px"><h3 style="margin:0">逐例对比明细</h3><select class="right" aria-label="筛选版本差异" onchange="compareRowFilter=this.value;$('#comparisonTable').innerHTML=comparisonTable()">${['全部差异','回归','改善','回复变化','一致','缺少证据'].map(t=>`<option ${compareRowFilter===t?'selected':''}>${t}</option>`).join('')}</select><button class="link" onclick="compareRowFilter='全部差异';renderComparison()">重置</button></div><div id="comparisonTable">${comparisonTable()}</div></section>`}
function comparisonTable(){const r=compareReport,rows=r.rows.filter(x=>compareRowFilter==='全部差异'||compareRowFilter.startsWith('模块:')&&x.module===compareRowFilter.slice(3)||x.change===compareRowFilter);const label=x=>x==='pass'?'通过':x==='fail'?'未通过':'缺少证据';return `<div class="compare-table-scroll"><table><thead><tr><th>场景 / 用例</th><th>A · ${r.config.left}</th><th>B · ${r.config.right}</th><th>差异结论</th><th>配置快照</th><th>操作</th></tr></thead><tbody>${rows.map(x=>`<tr><td><strong>${esc(x.name)}</strong><div class="row-sub">${esc(x.sceneName)} · ${esc(x.module)}</div></td><td><span class="tag ${x.left.result==='pass'?'green':x.left.result==='fail'?'red':'orange'}">${label(x.left.result)}</span></td><td><span class="tag ${x.right.result==='pass'?'green':x.right.result==='fail'?'red':'orange'}">${label(x.right.result)}</span></td><td><span class="tag ${x.change==='回归'?'red':x.change==='改善'?'green':''}">${x.change}</span></td><td>${x.configChanged?'配置有变化':'配置一致'}</td><td><button class="link" onclick="comparisonDetail('${x.id}')">左右详情</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">当前筛选没有匹配用例。</td></tr>'}</tbody></table></div><div class="footer"><span>显示 ${rows.length} / ${r.rows.length} 条 · ${compareRowFilter}</span><span>按稳定用例 ID 对齐</span></div>`}

function comparisonDetail(id){const r=compareReport,x=r.rows.find(x=>x.id===id);if(!x)return;modal(x.name,r.agentLabel+' / '+x.sceneName,`<div class="notice">用例 ID：${esc(x.id)} · ${x.configChanged?'两侧配置快照不同，需结合配置差异判读。':'两侧场景配置一致。'}</div><h3>同一用户输入</h3><pre class="bubble" style="white-space:pre-wrap">${esc(x.input)}</pre><div class="compare-sides">${['left','right'].map(side=>`<section class="compare-side"><h3>${side==='left'?'A · 基准':'B · 对比'} ${r.config[side]}</h3><span class="tag ${x[side].result==='pass'?'green':x[side].result==='fail'?'red':'orange'}">${x[side].result==='pass'?'断言通过':x[side].result==='fail'?'断言未通过':'缺少逐例证据'}</span><div class="bubble" style="margin:16px 0">${esc(x[side].reply)}</div><p class="muted">来源：${esc(x[side].source)}<br>耗时：${x[side].latency===null?'未记录':x[side].latency+' ms'}${r.demo?'（演示）':''}<br>场景配置：${r.config.scope==='scene'?'快照 '+r.config[side+'SceneRev']:'固定回归快照'}</p></section>`).join('')}</div><div class="compare-conclusion"><strong>对比结论：${x.change}</strong><p class="muted">${x.change==='回归'?'建议检查右侧版本的策略、Prompt 和路由变化，并保存为回归问题。':x.change==='缺少证据'?'需要补齐两侧相同用例的回复和业务断言记录。':'结合输入、回复和业务状态确认是否符合预期。'}</p></div>`,`<button onclick="closeModal()">关闭</button>`)}
function exportComparison(format){if(!compareReport)return;const r=compareReport;let content,type;if(format==='json'){content=JSON.stringify(r,null,2);type='application/json'}else{content=`<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>版本对比报告</title><style>body{font:14px/1.7 system-ui,sans-serif;color:#142238;max-width:1100px;margin:40px auto;padding:20px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #dce4ef;padding:12px;text-align:left}th{background:#edf3ff}pre{white-space:pre-wrap;background:#f3f6fb;padding:20px}</style><h1>${esc(r.agentLabel)} · 版本对比报告</h1><p>${esc(r.config.left)} → ${esc(r.config.right)} · ${esc(r.created)}</p><p>范围：${r.config.scope==='agent'?'整个 Agent':esc(r.sceneName)}；来源：${r.demo?'包含演示数据，非真实评测结论':'已有记录'}。</p><pre>${esc(JSON.stringify(compareMetrics(r),null,2))}</pre><table><thead><tr><th>场景 / 用例</th><th>左侧结果 / 回复</th><th>右侧结果 / 回复</th><th>差异</th></tr></thead><tbody>${r.rows.map(x=>`<tr><td>${esc(x.sceneName)}<br>${esc(x.name)}</td><td>${esc(x.left.result)}<br>${esc(x.left.reply)}</td><td>${esc(x.right.result)}<br>${esc(x.right.reply)}</td><td>${esc(x.change)}${x.configChanged?' · 配置变化':''}</td></tr>`).join('')}</tbody></table></html>`;type='text/html'}const url=URL.createObjectURL(new Blob([content],{type:type+';charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=r.id+'-'+salesAgent+'.'+format;a.click();URL.revokeObjectURL(url);notice('对比报告已导出')}

function groups(){return groupStore[salesAgent]??=['核心回归','专项验证']}function initSuites(){suites.forEach((s,i)=>{s.uid??='S-'+salesAgent+'-'+Date.now()+'-'+i;s.group??=i?'专项验证':'核心回归';s.updated??='2026-10-27 10:00'});groups()}function findSuite(id){return suites.find(s=>s.uid===id)}function members(s){return (s.members||s.ids.flatMap(id=>sceneData.some(s=>s.id===id)?listCases(getScene(id)).map((c,i)=>({scene:id,index:i})):[])).filter(m=>sceneData.some(s=>s.id===m.scene)&&m.index<getScene(m.scene).count)}function uniq(a){return [...new Map(a.map(m=>[m.scene+':'+m.index,m])).values()]}function stamp(){return new Date().toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})}

let recordFilters={name:'',suite:'',version:'',from:'',to:'',status:''},recordPage=1,recordSize=10;const hiddenRecordIds=new Set();
function prepareRecords(){runs.forEach((r,i)=>{r.recordId??='R-'+Date.now()+'-'+i})}function recordSuite(r){return r.suiteName||r.snapshot?.suiteName||'未关联测试集'}function recordDate(r){if(r.createdAt)return new Date(r.createdAt);if(r.date==='刚刚')return null;const text=r.date||'';if(/^\d{2}-\d{2}/.test(text))return new Date('2026-'+text.replace(' ','T'));return null}
function filteredRecords(){prepareRecords();return runs.map((r,index)=>({...r,index})).filter(r=>{const f=recordFilters,d=recordDate(r);return !hiddenRecordIds.has(r.recordId)&&r.name.includes(f.name)&&(!f.suite||recordSuite(r)===f.suite)&&(!f.version||r.version===f.version)&&(!f.status||r.state===f.status)&&(!f.from||d&&d>=new Date(f.from+'T00:00:00'))&&(!f.to||d&&d<=new Date(f.to+'T23:59:59'))})}
function changeRecordFilter(k,v){recordFilters[k]=v;recordPage=1;$('#recordGrid').innerHTML=recordGrid()}
runsView=function(){prepareRecords();const active=runs.filter(r=>!hiddenRecordIds.has(r.recordId)),select=(key,placeholder,options)=>`<select aria-label="${placeholder}" onchange="changeRecordFilter('${key}',this.value)"><option value="">${placeholder}</option>${options.map(v=>`<option ${recordFilters[key]===v?'selected':''}>${esc(v)}</option>`).join('')}</select>`;return `<section class="panel execution-records"><div class="record-filters"><input type="search" aria-label="任务名称" placeholder="请输入任务名称" value="${esc(recordFilters.name)}" oninput="changeRecordFilter('name',this.value)">${select('suite','请选择使用测试集',[...new Set(active.map(recordSuite))])}${select('version','请选择执行版本',[...new Set(active.map(r=>r.version))])}<div class="record-dates"><input type="date" aria-label="起始日期" value="${recordFilters.from}" onchange="changeRecordFilter('from',this.value)"><span class="muted">至</span><input type="date" aria-label="结束日期" value="${recordFilters.to}" onchange="changeRecordFilter('to',this.value)"></div>${select('status','请选择执行状态',[...new Set(active.map(r=>r.state))])}<button onclick="recordFilters={name:'',suite:'',version:'',from:'',to:'',status:''};recordPage=1;render()">重置</button></div><div id="recordGrid">${recordGrid()}</div><div class="muted" style="margin-top:16px">通过率按业务断言统计；平均响应时长和节点仅展示已记录值。执行完成不代表业务断言全部通过。</div></section>`};
function recordRate(r){if(r.assertionTotal!==undefined&&r.assertionTotal>0)return ((r.assertionPassed||0)/r.assertionTotal*100).toFixed(1)+'%';if(r.demo)return '未记录';return '—'}
function recordGrid(){const all=filteredRecords(),pages=Math.max(1,Math.ceil(all.length/recordSize));recordPage=Math.min(recordPage,pages);return `<div class="record-scroll"><table class="record-table"><thead><tr><th>任务名称</th><th>使用测试集</th><th>执行版本</th><th>执行节点</th><th>执行轮数</th><th>执行通过率</th><th>平均响应时长</th><th>执行进度 <button class="link" onclick="refreshRecordGrid()">刷新 ↻</button></th><th>创建时间</th><th>操作</th></tr></thead><tbody>${all.slice((recordPage-1)*recordSize,recordPage*recordSize).map(r=>{const done=r.state==='执行完成'||r.state==='失败',progress=done?100:Math.min(100,r.progress||0),date=recordDate(r);return `<tr><td><strong title="${esc(r.name)}">${esc(r.name)}</strong></td><td>${esc(recordSuite(r))}</td><td>${esc(r.version||'—')}</td><td>${r.nodes?.length?r.nodes.map(n=>`<span class="tag green">${esc(n)}</span>`).join(' '):'—'}</td><td>${r.rounds??r.snapshot?.rounds??'—'}</td><td>${recordRate(r)}</td><td>${Number.isFinite(r.avgLatencyMs)?(r.avgLatencyMs/1000).toFixed(2)+'秒':'—'}</td><td><div class="record-progress-label"><span>${done?'已完成':esc(r.state)}</span><span>${progress}%</span></div><div class="progress"><i style="width:${progress}%;background:${done?'#49ba20':'#2460f5'}"></i></div></td><td class="muted">${date?date.toLocaleDateString('zh-CN')+'<br>'+date.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false}):esc(r.date||'—')}</td><td><button class="link" onclick="showResult(${r.index})">详情</button><button class="link" onclick="hideRecord('${r.recordId}')">删除</button></td></tr>`}).join('')||'<tr><td colspan="10" class="empty">没有符合筛选条件的执行记录</td></tr>'}</tbody></table></div><div class="footer"><span>共 ${all.length} 条</span><div><button ${recordPage===1?'disabled':''} onclick="recordPage--;$('#recordGrid').innerHTML=recordGrid()">‹</button> <span class="record-page">${recordPage}</span> <button ${recordPage===pages?'disabled':''} onclick="recordPage++;$('#recordGrid').innerHTML=recordGrid()">›</button> <select aria-label="执行记录每页条数" onchange="recordSize=+this.value;recordPage=1;$('#recordGrid').innerHTML=recordGrid()">${[10,20,50].map(n=>`<option value="${n}" ${recordSize===n?'selected':''}>${n} 条/页</option>`).join('')}</select></div></div>`}

exportResult=function(){const r=runs[selectedRun];const data={prototype:true,...r};const html=`<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>${esc(r.name)} - 测试报告</title><style>body{font:14px/1.8 system-ui,sans-serif;color:#142238;max-width:1100px;margin:40px auto;padding:20px}h1{font-size:24px}dl{display:grid;grid-template-columns:150px 1fr}dt,dd{padding:10px;border-bottom:1px solid #e5ebf3;margin:0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f6fb;padding:20px}.notice{background:#edf3ff;padding:16px}</style><h1>${esc(r.name)}</h1><p class="notice">本报告由交互原型导出。${r.demo?'数据为本地模拟结果。':'任务摘要来自已载入记录，未载入的证据不代表通过。'}</p><dl><dt>被测 Agent</dt><dd>${esc(r.agent||salesAgent)}</dd><dt>执行版本</dt><dd>${esc(r.version)}</dd><dt>使用测试集</dt><dd>${esc(r.suiteName||'未关联测试集')}</dd><dt>执行状态</dt><dd>${esc(r.state)}</dd><dt>用例数</dt><dd>${r.count}</dd><dt>断言失败</dt><dd>${r.failed}</dd><dt>待人工评审</dt><dd>${r.review}</dd></dl><h2>人工评审</h2><pre>${esc(JSON.stringify({reviews:r.reviews||{},notes:r.notes||{}},null,2))}</pre><h2>配置快照与运行记录</h2><pre>${esc(JSON.stringify(data,null,2))}</pre></html>`;const url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='测试报告-'+(r.recordId||selectedRun)+'.html';a.click();URL.revokeObjectURL(url);notice('测试报告已下载')};

sceneDetail=function(id){sceneDetailId=id;const s=getScene(id),bound=s.codeAssets;modal(s.name,'测试场景配置 · '+catalog().label,`<div class="scene-detail-shell"><div class="scene-detail-summary"><div><strong>${esc(s.name)}</strong><div class="row-sub">${s.phase} / ${esc(s.module)} / ${esc(s.task)}</div></div><span class="tag">场景配置 v${s.rev||1}</span><span class="tag ${bound&&!sceneCodeDirty(id)?'green':'orange'}">${bound&&!sceneCodeDirty(id)?'代码组合已绑定':'代码组合待确认'}</span></div><div class="scene-detail-tabs"><button class="${sceneDetailTab==='code'?'active':''}" onclick="sceneDetailTab='code';sceneDetail('${id}')"><strong>代码资产</strong><span>Agent 模块状态与基础代码设置</span></button><button class="${sceneDetailTab==='business'?'active':''}" onclick="sceneDetailTab='business';sceneDetail('${id}')"><strong>用户业务场景设置</strong><span>用户状态、训练营周期与业务任务</span></button></div>${sceneDetailTab==='code'?sceneCodeView(id):sceneBusinessView(id)}</div>`,`<button onclick="closeModal()">关闭</button>${sceneDetailTab==='business'?`<button onclick="sceneEditor('${id}')">编辑业务场景</button><button class="primary" onclick="launch('${id}')">开始测试</button>`:`<button class="primary" onclick="bindSceneCode('${id}')">绑定当前代码版本组合</button>`}`)};

function sceneCodeView(id){const s=getScene(id),d=codeDraft(id);return `<div class="scene-section-heading"><h2>基础代码设置</h2><a href="${sourceBase}app/${salesAgent.toLowerCase()}/code-assets" target="_blank" rel="noopener">打开原平台代码资产 ↗</a></div><p class="muted">选择仓库、分支和固定快照，以明确当前测试场景基于哪一组源码。代码快照不等同 Agent 版本，也不等同 Java 运行时部署版本。</p>${sceneCodeCatalog.map((repo,i)=>{const r=d.repositories.find(r=>r.id===repo.id);return `<section class="panel scene-repository"><div class="toolbar"><label><input type="checkbox" aria-label="选择仓库 ${repo.name}" ${r.selected?'checked':''} onchange="codeDraft('${id}').repositories[${i}].selected=this.checked;sceneDetail('${id}')"> <strong>${repo.name}</strong></label><span class="tag green">已登记仓库</span><span class="right muted">${repo.id}</span></div><p class="muted">关联业务：Sleep / Health / Food · 可读目录以真实仓库授权为准。</p><div class="two"><div class="field"><label for="sceneBranch${i}">代码分支</label><select id="sceneBranch${i}" ${r.selected?'':'disabled'} onchange="codeDraft('${id}').repositories[${i}].branch=this.value;codeDraft('${id}').repositories[${i}].snapshot='';sceneDetail('${id}')">${repo.branches.map(b=>`<option ${r.branch===b?'selected':''}>${b}</option>`).join('')}</select></div><div class="field"><label for="sceneSnapshot${i}">代码快照 *</label><select id="sceneSnapshot${i}" ${r.selected?'':'disabled'} onchange="codeDraft('${id}').repositories[${i}].snapshot=this.value;sceneDetail('${id}')"><option value="">请选择固定代码快照</option><option value="demo-${r.branch}-001" ${r.snapshot==='demo-'+r.branch+'-001'?'selected':''}>${r.branch} · 配置快照 001（演示）</option><option value="demo-${r.branch}-002" ${r.snapshot==='demo-'+r.branch+'-002'?'selected':''}>${r.branch} · 配置快照 002（演示）</option></select></div></div><div class="toolbar"><button ${r.selected?'':'disabled'} onclick="notice('演示：分支目录已刷新；未发起真实代码获取')">刷新远端分支</button><button ${r.selected?'':'disabled'} onclick="notice('演示：已显示可选快照；真实拉取请进入原平台')">拉取最新代码</button><button class="link" onclick="sceneCodeLog('${id}')">查看 function unifiedSceneCode(){const d=unifiedSceneDraft;return `<h2>代码资产</h2><p class="muted">基础代码配置与详情一致。选择仓库后必须指定固定快照；也可取消勾选，先保存业务场景。</p>${d.codeRepositories.map((r,i)=>`<div class="panel scene-repository"><label><input type="checkbox" aria-label="关联基础代码仓库" ${r.selected?'checked':''} onchange="unifiedSceneDraft.codeRepositories[${i}].selected=this.checked;unifiedSceneForm()"> <strong>Java 业务源码</strong> <span class="muted">${esc(r.id)}</span></label><div class="two"><div class="field"><label>代码分支</label><select aria-label="代码分支" ${r.selected?'':'disabled'} onchange="unifiedSceneDraft.codeRepositories[${i}].branch=this.value;unifiedSceneDraft.codeRepositories[${i}].snapshot='';unifiedSceneForm()">${['pre','main'].map(v=>`<option ${r.branch===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>代码快照</label><select aria-label="代码快照" ${r.selected?'':'disabled'} onchange="unifiedSceneDraft.codeRepositories[${i}].snapshot=this.value"><option value="">请选择固定代码快照</option>${['001','002'].map(v=>`<option value="demo-${r.branch}-${v}" ${r.snapshot==='demo-'+r.branch+'-'+v?'selected':''}>${r.branch} · 配置快照 ${v}（演示）</option>`).join('')}</select></div></div><div class="toolbar"><button onclick="notice('演示：已刷新分支目录，未请求真实仓库')">刷新远端分支</button><button onclick="notice('演示：可选快照已显示，未执行真实拉取')">拉取最新代码</button></div></div>`).join('')}<div class="notice">仓库来自已核对的平台结构；分支和快照为本地演示选项。</div>`}

function localConfigView(){const d=configCenterData.configs[salesAgent.toLowerCase()]||{items:[]},g=[...new Set(d.items.map(x=>x.group))];return `<section class="panel"><div class="title"><div><h2>本地依赖配置</h2><span class="muted">${catalog().label} · 配置 key、配置组与缓存一致性</span></div>${sourcePage('app/'+salesAgent.toLowerCase()+'/configurations','查看实时配置 ↗')}</div><div class="toolbar"><input type="search" aria-label="搜索本地配置" placeholder="搜索 key 或配置组" value="${esc(configQuery)}" oninput="configQuery=this.value;configPage=1;$('#localConfigList').innerHTML=localConfigList()"><select aria-label="筛选本地配置组" onchange="configGroup=this.value;configPage=1;render()"><option value="">全部配置组</option>${g.map(v=>`<option ${configGroup===v?'selected':''}>${esc(v)}</option>`).join('')}</select><button onclick="configQuery='';configGroup='';configPage=1;render()">重置</button><span class="right muted">${d.items.length} 项配置</span></div><div id="localConfigList">${localConfigList()}</div><div class="notice">匹配原平台只读查看结构。为避免将敏感配置复制到离线原型，完整值与 Prompt 在原平台查看；缓存一致不等于本轮最终提示词。</div></section>`}
function localConfigList(){const all=(configCenterData.configs[salesAgent.toLowerCase()]?.items||[]).filter(x=>(!configGroup||x.group===configGroup)&&(x.key+' '+x.group).toLowerCase().includes(configQuery.toLowerCase())),pages=Math.max(1,Math.ceil(all.length/15));configPage=Math.min(configPage,pages);return `${all.slice((configPage-1)*15,configPage*15).map(x=>`<details class="choice config-record"><summary><strong>${esc(x.key)}</strong><span class="tag">${esc(x.group)}</span><span class="tag ${x.matches===true?'green':'orange'}">${x.matches===true?'缓存一致':x.matches===false?'缓存缺失或不一致':'一致性未记录'}</span></summary><div class="notice">完整值、内容预览、读取时间与缓存对比请进入该业务的原平台配置页。</div>${sourcePage('app/'+salesAgent.toLowerCase()+'/configurations','查看完整配置 ↗')}</details>`).join('')||'<div class="empty">没有匹配配置。</div>'}<div class="footer"><span>显示 ${Math.min(15,Math.max(0,all.length-(configPage-1)*15))} / ${all.length} 项</span><div><button ${configPage===1?'disabled':''} onclick="configPage--;$('#localConfigList').innerHTML=localConfigList()">上一页</button> ${configPage} / ${pages} <button ${configPage===pages?'disabled':''} onclick="configPage++;$('#localConfigList').innerHTML=localConfigList()">下一页</button></div></div>`}

function expandedStateFields(scope){const d=normalizeBusinessState(businessDraft(scope)),phaseValue=scope==='scene'?d.phase:d.period,t=timeParts(d);return `<section class="panel business-state-block"><h3>训练营设置</h3><div class="two"><div class="field"><label for="${scope}Cycle">训练营周期 *</label><input id="${scope}Cycle" list="campDays" value="${esc(d.day)}" placeholder="D1、D2、D3…" oninput="businessDraft('${scope}').day=this.value"><datalist id="campDays">${['开营前','D1','D2','D3','D4','D5','D6','D7','结营后'].map(v=>`<option value="${v}">`).join('')}</datalist><span class="muted">支持 D1、D2… 任意训练日，也可选开营前或结营后。</span></div><div class="field"><label for="${scope}Phase">业务阶段</label><select id="${scope}Phase" onchange="businessDraft('${scope}').${scope==='scene'?'phase':'period'}=this.value">${['接量期','服务期','销转期'].map(v=>`<option ${v===phaseValue?'selected':''}>${v}</option>`).join('')}</select></div></div><h3>模拟时间（自定义）</h3><div class="business-time-fields"><div class="field"><label for="${scope}Date">日期</label><input id="${scope}Date" type="date" value="${t.date}" onchange="updateBusinessTime('${scope}')"></div><div class="field"><label for="${scope}Period">时段</label><select id="${scope}Period" onchange="updateBusinessTime('${scope}')">${['早','中','晚'].map(v=>`<option ${v===t.period?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label for="${scope}Hour">点</label><input type="number" id="${scope}Hour" min="1" max="12" value="${t.hour}" oninput="updateBusinessTime('${scope}')"></div><div class="field"><label for="${scope}Minute">分</label><input type="number" id="${scope}Minute" min="0" max="59" value="${t.minute}" oninput="updateBusinessTime('${scope}')"></div></div><p class="muted">早 8 点对应 08:00，中 12 点对应 12:00，晚 8 点对应 20:00。</p><div class="field"><label>SOP 状态</label><select aria-label="SOP 状态" onchange="businessDraft('${scope}').sop=this.value">${['未开始','进行中','已结束'].map(v=>`<option ${v===d.sop?'selected':''}>${v}</option>`).join('')}</select></div></secti nst ref=c.getAttribute('r')||'A1';let col=0;for(const ch of ref.replace(/\d/g,''))col=col*26+ch.charCodeAt(0)-64;const type=c.getAttribute('t'),value=c.getElementsByTagName('v')[0]?.textContent||'';cells[col-1]=type==='s'?strings[+value]||'':type==='inlineStr'?[...c.getElementsByTagName('t')].map(t=>t.textContent).join(''):value}return Array.from({length:cells.length},(_,i)=>cells[i]||'')}).filter(r=>r.some(x=>x.trim()))}
async function readSuiteImportFile(file){if(!file||!suiteImportDraft)return;const draft=suiteImportDraft;try{if(file.size>5*1024*1024)throw Error('文件不能超过5MB');const ext=file.name.split('.').pop().toLowerCase();if(!['xlsx','csv','tsv'].includes(ext))throw Error('请选择 XLSX、CSV 或 TSV 文件');const table=ext==='xlsx'?await readLocalXlsx(file):parseDelimitedTable(await file.text());if(draft!==suiteImportDraft)return;draft.rows=tableToImportRows(table);draft.error=''}catch(e){if(draft!==suiteImportDraft)return;draft.rows=[];draft.error='读取失败：'+e.message}renderSuiteImport()}

function generateSuiteImportCases(){const d=suiteImportDraft,s=sceneData.find(s=>s.id===d.scene);if(!s)return notice('请先选择对应场景');if(!d.request.trim())return notice('请填写生成需求');if(!Number.isInteger(d.count)||d.count<1||d.count>20)return notice('生成条数需为1–20');const seeds=s.cases.filter(c=>!c.placeholder);const variants=['常规表达','口语表达','信息不完整','重复追问','异常边界'];d.rows=Array.from({length:d.count},(_,i)=>{const c=seeds.length?seeds[i%seeds.length]:null;return {name:s.name+' · 助手草稿 '+(i+1)+'（'+variants[i%5]+'）',input:c?.rounds.join(' || ')||'老师，我想咨询'+s.name+'，能帮我处理吗？',expected:c?.expected||'请根据「'+d.request+'」补充可验收的预期结果。',version:s.agentVersion||'',source:'assistant-demo'}});d.error='';renderSuiteImport()}
function commitSuiteImport(){const d=suiteImportDraft;if(!d||d.agent!==salesAgent)return notice('Agent已切换，请重新导入');const suite=findSuite(d.suite),scene=sceneData.find(s=>s.id===d.scene);if(!suite||!scene||!suite.ids.includes(scene.id))return notice('所选场景不在当前测试集中');if(!d.rows.length)return notice('没有可导入的用例');const rows=d.rows.map(r=>({...r,name:r.name.trim(),rounds:r.input.split('||').map(x=>x.trim()).filter(Boolean),expected:r.expected.trim()}));const bad=rows.findIndex(r=>!r.name||!r.rounds.length||!r.expected||(r.version&&r.version!==scene.agentVersion));if(bad>=0){d.error='第'+(bad+1)+'条用例内容不完整或版本不匹配，请修正后导入';renderSuiteImport();return}const seen=new Set(listCases(scene).map(c=>JSON.stringify([c.name,c.rounds]))),accepted=[];for(const r of rows){const key=JSON.stringify([r.name,r.rounds]);if(seen.has(key))continue;seen.add(key);accepted.push(r)}if(!accepted.length)return notice('全部用例已存在，无需重复导入');const existing=members(suite);for(const r of accepted){const index=scene.cases.length;scene.cases.push({name:r.name,rounds:r.rounds,expected:r.expected,desc:r.source==='online-demo'?'线上示例会话提取 · '+r.sourceSession:d.mode==='assistant'?'测试助手本地演示草稿 · '+d.request:'表格导入',source:r.source||d.mode,sourceSession:r.sourceSession||null,generationPrompt:r.generationPrompt||null,userRequest:r.userRequest||null,generationType:r.generationType||null,rev:1});existing.push({scene:scene.id,index})}scene.count=scene.cases.length;suite.members=uniq(existing);suite.updated=stamp();const skipped=rows.length-accepted.length;closeModal();suiteImportDraft=null;render();notice('已导入'+accepted.length+'条用例'+(skipped?'，跳过'+skipped+'条重复用例':''))}

function d1ComputedLayer(){const d=sceneWizard.d1Values;if(d.latestClassAttendStatus==='未进入课堂')return 'L1';if(d.latestClassAttendStatus==='进入但未达有效时长')return 'L2';if(d.latestClassAttendStatus!=='已有效到课'||d.latestClassWatchPercent===undefined)return '待补充学习记录';const done=(d.userTags||[]).includes('#课1已打卡(普通)');return d.latestClassWatchPercent>=70?(done?'L6':'L4'):(done?'L5':'L3')}
function d1RefreshSummary(){const e=document.querySelector('#d1LayerSummary');if(e)e.textContent='根据当前数据计算：'+d1ComputedLayer()}
function d1Options(k){if(/FeedbackTendency$/.test(k))return ['负向','正向','中性','不适用'];if(/AttendStatus$/.test(k))return ['未进入课堂','进入但未达有效时长','已有效到课'];if(k==='userGender')return ['男','女'];if(k==='previewCourseProgress')return [['NOT_ATTENDED','未到课'],['ATTENDED_NOT_COMPLETED','到课未完课'],['COMPLETED','已完课']];if(k==='latestClassNo')return [['1','第一课'],['2','第二课'],['3','第三课']];if(k==='coursePeriod')return ['课前准备','临近上课','上课中','课后'];return null}
function d1Field(k,extra=false){const f=taijiStateRegistry.find(f=>f.key===k),v=sceneWizard.d1Values[k],fixed=['campDay','coursePeriod','previewCourseStatus'].includes(k)||wizardTemplate().stage&&['d1Task4Sent','d1Task4Pending'].includes(k);let input='';if(fixed)input='<strong>'+esc(v===undefined?'随先导课学习状态联动':v===true?'是':v===false?'否':v)+'</strong><span class="tag">自动带入</span>';else if(/FeedbackType$/.test(k)){input='<div class="toolbar">'+['身体感受','动作问题','师资课程','其他'].map(x=>'<label><input type="checkbox" '+((v||[]).includes(x)?'checked':'')+' onchange="d1Toggle(\''+k+'\',\''+x+'\',this.checked)"> '+x+'</label>').join('')+'</div>'}else if(k==='userTags'){input='<input value="'+esc((v||[]).join('、'))+'" placeholder="多个真实业务标签用顿号分隔" oninput="sceneWizard.d1Values.userTags=this.value.split(\'、\').map(x=>x.trim()).filter(Boolean);d1RefreshSummary()"><small class="muted">第一课打卡标签：#课1已打卡(普通)。无标签不代表没有反馈原文。</small>'}else{const opts=d1Options(k),bool=['previewDone','cannotAttend','optOut','latestClassFinished'].includes(k)||/(Sent|Pending)$/.test(k);if(opts||bool)input='<select onchange="d1Set(\''+k+'\',this.value)"><option value="">未指定 / 未记录</option>'+(opts||( [['true','是'],['false','否']] )).map(o=>{const [value,label]=Array.isArray(o)?o:[o,o];return '<option value="'+esc(value)+'" '+(String(v)===String(value)?'selected':'')+'>'+esc(label)+'</option>'}).join('')+'</select>';else if(/Rounds$|Percent$/.test(k))input='<input type="number" min="0" step="1" '+(/Percent$/.test(k)?'max="100"':'')+' value="'+(v??'')+'" oninput="d1Set(\''+k+'\',this.value)">';else input='<textarea oninput="d1Set(\''+k+'\',this.value)" placeholder="未指定时保留快照原值">'+esc(v||'')+'</textarea>'}return '<div class="field"><label>'+esc(f.label)+(extra?' <button class="link" onclick="d1Remove(\''+k+'\')">移出展示</button>':'')+'</label>'+input+(extra?'<small class="muted">'+esc(k)+' · '+({business:'业务记录准备',chat:'聊天历史',agent:'Agent历史写入'}[f.source])+'</small>':'')+'</div>'}
function d1Toggle(k,x,on){const a=sceneWizard.d1Values[k]||[];sceneWizard.d1Values[k]=on?[...new Set([...a,x])]:a.filter(v=>v!==x)}
function d1Remove(k){sceneWizard.d1Added=sceneWizard.d1Added.filter(x=>x!==k);renderSceneWizard()}
function d1Add(k){sceneWizard.d1Added=[...new Set([...sceneWizard.d1Added,k])];renderSceneWizard()}
function d1Additional(){const keys=new Set(d1Rule().core);const query=(sceneWizard.d1Search||'').toLowerCase();return taijiStateRegistry.filter(f=>!keys.has(f.key)&&!sceneWizard.d1Added.includes(f.key)&&(f.label+' '+f.key).toLowerCase().includes(query)).map(f=>'<button class="choice" style="width:100%;text-align:left;padding:10px" onclick="d1Add(\''+f.key+'\')">＋ '+esc(f.label)+' <small class="muted">'+esc(f.key)+'</small></button>').join('')||'<p class="muted">没有匹配项</p>'}
function d1StateBody(){d1Init();const w=sceneWizard,t=wizardTemplate(),r=d1Rule();return '<h2>用户状态</h2><div class="choice" style="background:#f0f5ff"><strong>'+esc(t.name)+'</strong><p class="muted">服务期 · Day1 · 课后 · '+(t.stage?'阶段 '+t.stage:'任务场景')+'</p><p>'+r.note+'</p><span class="tag">营期1天</span> <span class="tag">课后</span> <span class="tag">适用 '+r.layers.join(' / ')+'</span></div>'+stateModePanel()+(stateMode()==='auto'?'<div class="notice">不固定状态时，保存本场景的有效分支范围，后续按覆盖策略生成。当前原型不执行真实生成。</div>':'<section class="choice"><h3>核心用户状态 <span class="tag">'+r.core.length+'项 · 默认展示</span></h3><div class="field"><label>快速填入一组学习记录（可选）</label><select onchange="d1ApplyProfile(this.value)"><option value="">不使用预设 / 自定义</option>'+r.layers.map(v=>'<option '+(w.d1Profile===v?'selected':'')+'>'+v+'</option>').join('')+'</select><small class="muted">预设填入一组代表数据，仍可微调；实际分层由学习记录与标签计算。</small></div><p id="d1LayerSummary" class="muted">根据当前数据计算：'+d1ComputedLayer()+'</p><div class="two">'+r.core.map(k=>d1Field(k)).join('')+'</div>'+(t.stage?'<div class="notice">'+({C:'C：收尾未发、无待发标记；追问0或1次。',B:'B：收尾未发，待发为真或追问≥2；闲聊入口需待发为真。',A:'A：收尾已发，只点评、不追问、不重复收尾。'}[t.stage])+'</div>':'')+'</section>'+(w.d1Added.length?'<section class="choice"><h3>已添加的其他状态</h3><div class="two">'+w.d1Added.map(k=>d1Field(k,true)).join('')+'</div><p class="muted">移出展示不会清空已填值；清空输入表示不覆盖快照原值。</p></section>':'')+'<details class="choice"><summary>添加其他状态 · 完整37项可查</summary><p class="muted">按需添加到上方配置，未添加的字段保留快照，不自动重置。未来课次、旧字段仅建议用于专项测试。</p><input type="search" placeholder="搜索状态名称或配置键" oninput="sceneWizard.d1Search=this.value;document.querySelector(\'#d1Additional\').innerHTML=d1Additional()"><div id="d1Additional" style="max-height:300px;overflow:auto;margin-top:12px">'+d1Additional()+'</div></details>')+'<p class="notice">历史反馈是测试开始前已记录的内容；本轮回复在用例管理维护。业务字段属于数据准备目标，尚未调用真实业务工具。</p>'}
const wizardBeforeD1States=renderSceneWizard;renderSceneWizard=function(){if(!isTaijiD1()||sceneWizard.step!==2)return wizardBeforeD1States();modal(sceneWizard.id?'编辑太极测试场景':'创建太极测试场景','太极 AI 销售 · 场景定义版','<div class="wizard-steps"><div>1 选择版本</div><div>2 选择场景</div><div class="active">3 用户状态</div></div>'+d1StateBody(),'<button onclick="closeModal();sceneWizard=null">取消</button><button onclick="sceneWizard.step=1;renderSceneWizard()">上一步</button><button class="primary" onclick="saveWizardScene()">保存场景</button>')};
function d1Validate(){const w=sceneWizard,d=w.d1Values,t=wizardTemplate();for(const [k,v]of Object.entries(d)){if((/Rounds$/.test(k)||/Percent$/.test(k))&&(!Number.isInteger(v)||v<0||(/Percent$/.test(k)&&v>100)))return '轮次须为非负整数，观看进度须为0–100整数'}if(d.latestClassAttendStatus==='未进入课堂'&&d.latestClassWatchPercent>0)return '未到课不能同时有观看进度';const layer=d1ComputedLayer();if(/^L[1-6]$/.test(layer)&&!d1Rule().layers.includes(layer))return '当前数据计算为'+layer+'，不在本场景适用范围，请调整或选择其他场景';if(t.stage==='C'&&d.d1FollowUpRounds!==undefined&&d.d1FollowUpRounds>=2)return 'C阶段追问次数应小于2';if(d.d1Task4Sent===true&&d.d1Task4Pending===true)return '收尾已发与待发不能同时为是';return ''}
const saveBeforeD1States=saveWizardScene;saveWizardScene=function(){if(!isTaijiD1())return saveBeforeD1States();d1Init();const w=sceneWizard,id=w.id,mode=stateMode();if(mode!=='auto'){const e=d1Validate();if(e)return notice(e)}const values=mode==='auto'?{campDay:1,coursePeriod:'课后'}:structuredClone(w.d1Values),added=[...w.d1Added],core=[...d1Rule().core];saveBeforeD1States();if(sceneWizard)return;const s=id?sceneData.find(s=>s.id===id):sceneData.at(-1);s.taijiStateConfig={values,added,core,mode};s.stateRulesPending=false;s.scenarioUserState={summary:mode==='auto'?'自动生成 · 场景有效分支':'已配置 '+Object.keys(values).filter(k=>!['campDay','coursePeriod'].includes(k)).length+' 项状态'};render()};
const editorBeforeD1States=sceneEditor;sceneEditor=function(id){editorBeforeD1States(id);if(id&&isTaijiD1()){const cfg=getScene(id).taijiStateConfig;sceneWizard.d1Values=structuredClone(cfg?.values||{});sceneWizard.d1Added=[...(cfg?.added||[])];sceneWizard.stateMode=cfg?.mode||'auto';renderSceneWizard()}};
const stateCellBeforeD1States=sceneStateCell;sceneStateCell=function(s){return s.taijiStateConfig?'<span class="scene-state-summary">'+esc(s.scenarioUserState.summary)+'</span>':stateCellBeforeD1States(s)};
const detailBeforeD1States=sceneDetail;sceneDetail=function(id){const s=getScene(id);if(!s.taijiStateConfig)return detailBeforeD1States(id);modal(s.name,'用户状态 · Day1课后','<section class="choice"><h3>已保存的状态</h3>'+Object.entries(s.taijiStateConfig.values).map(([k,v])=>'<p><span class="muted">'+esc(taijiStateRegistry.find(f=>f.key===k)?.label||k)+'：</span>'+esc(Array.isArray(v)?v.join('、'):v===true?'是':v===false?'否':v)+'</p>').join('')+'</section>','<button onclick="closeModal()">关闭</button><button class="primary" onclick="sceneEditor(\''+id+'\');sceneWizard.step=2;renderSceneWizard()">编辑用户状态</button>')};
const generateBeforeD1States=generateStateFromChat;generateStateFromChat=function(){if(!isTaijiD1())return generateBeforeD1States();d1Init();const w=sceneWizard,p=(w.statePrompt||'').trim();if(!p)return notice('请描述希望配置的用户状态');w.stateMessages??=[];w.stateMessages.push({role:'user',text:p});const layer=p.match(/L[1-6]/i);if(layer&&d1Rule().layers.includes(layer[0].toUpperCase())){const l=layer[0].toUpperCase();w.d1Values.latestClassAttendStatus=l==='L1'?'未进入课堂':l==='L2'?'进入但未达有效时长':'已有效到课';w.d1Values.latestClassWatchPercent=['L4','L6'].includes(l)?80:l==='L1'?0:30;w.d1Values.userTags=['L5','L6'].includes(l)?['#课1已打卡(普通)']:[]}const percent=p.match(/(?:观看|进度)[^\d]*(\d+)\s*%?/);if(percent)w.d1Values.latestClassWatchPercent=+percent[1];if(/肩颈/.test(p))w.d1Values.painPoint='肩颈不适';const e=d1Validate();w.stateMessages.push({role:'assistant',text:e?'草稿存在冲突：'+e+'，请在下方调整。':'已填入可识别的分层 / 观看进度 / 肩颈条件，请检查下方状态。其余要求保留，当前为本地规则演示。'});w.statePrompt='';renderSceneWizard()};

// Present scene-critical states directly, without configuration-mode selectors.
stateModePanel=function(){return ''};
stateMode=function(){return 'manual'};
const wizardBeforeDirectStates=renderSceneWizard;renderSceneWizard=function(){if(sceneWizard){sceneWizard.stateMode='manual';sceneWizard.enabled=true}return wizardBeforeDirectStates()};
const deepBodyBeforeDirectStates=deepStateBody;deepStateBody=function(){sceneWizard.enabled=true;let html=deepBodyBeforeDirectStates();return html.replace(/<label class="choice"><input type="checkbox"[^>]*> 为本场景配置初始状态<\/label>/,'')};

const d1BodyBeforeDirectStates=d1StateBody;d1StateBody=function(){const html=d1BodyBeforeDirectStates();return html.replace(/<div class="field"><label>快速填入一组学习记录（可选）<\/label><select[\s\S]*?<\/select><small class="muted">[\s\S]*?<\/small><\/div>/,'').replace(/<h3>核心用户状态 <span class="tag">[^<]*<\/span><\/h3>/,'<h3>关键用户状态</h3>')};
render();
</script></body></html>
